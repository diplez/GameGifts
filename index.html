<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Renacer del Amor</title>
    <link rel="stylesheet" href="styles.css?v=1.0">
</head>
<body>
    <div class="scene">
        <!-- Fondo con partículas -->
        <div class="particles-container"></div>

        <!-- Tierra -->
        <div class="ground">
            <div class="soil"></div>
            <div class="cracks"></div>
        </div>

        <!-- Gota de agua -->
        <div class="water-drop"></div>

        <!-- Semilla bajo tierra -->
        <div class="seed">
            <div class="seed-glow"></div>
        </div>

        <!-- Planta creciendo -->
        <div class="plant">
            <!-- Tallo -->
            <div class="stem">
                <div class="stem-segment stem-1"></div>
                <div class="stem-segment stem-2"></div>
                <div class="stem-segment stem-3"></div>
            </div>

            <!-- Hojas -->
            <div class="leaves">
                <div class="leaf leaf-left"></div>
                <div class="leaf leaf-right"></div>
            </div>

            <!-- Capullo -->
            <div class="bud">
                <div class="bud-inner"></div>
            </div>

            <!-- Flor -->
            <div class="flower">
                <div class="petal petal-1"></div>
                <div class="petal petal-2"></div>
                <div class="petal petal-3"></div>
                <div class="petal petal-4"></div>
                <div class="petal petal-5"></div>
                <div class="petal petal-6"></div>
                <div class="flower-center"></div>
            </div>
        </div>

        <!-- Corazón final -->
        <div class="heart">
            <div class="heart-left"></div>
            <div class="heart-right"></div>
            <div class="heart-glow"></div>
        </div>

        <!-- Textos sentimentales -->
        <div class="text-overlay text-1">Todo comienza con una chispa...</div>
        <div class="text-overlay text-2">Creciendo juntos...</div>
        <div class="text-overlay text-3">Floreciendo en ti...</div>
        <div class="text-overlay text-4">Nuestro amor, eterno.</div>
        <div class="text-overlay text-final">
            <h2>Para la Srta. Yupanqui</h2>
            <p>Con todo mi corazón 💛→❤️</p>
        </div>
    </div>

    <!-- Botón de reinicio -->
    <button class="restart-btn" onclick="restartAnimation()">Revivir la magia ✨</button>

    <script src="script.js?v=1.0"></script>
</body>
</html>
